org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin stays OFF: it is a GLOBAL flag, and every Flutter plugin this app
# uses (app_settings, device_info_plus, firebase_core, firebase_crashlytics,
# package_info_plus, safe_device, share_plus) still applies the Kotlin Gradle Plugin
# at its latest published version. Turning this on fails plugin subproject
# configuration. Flip to true only once those plugins ship built-in-Kotlin support.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
